<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>戦国時代クイズ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="crest" aria-hidden="true">
            <span class="crest-ring"></span>
            <span class="crest-emblem"></span>
          </div>
          <div class="brand-text">
            <h1>戦国時代クイズ</h1>
            <p class="subline">
              難易度選択 / <span id="perRunLabel">10</span>問出題 / 復習モード / 解説つき
            </p>
          </div>
        </div>

        <button id="openSettings" class="icon-btn" type="button" aria-label="設定を開く">
          設定
        </button>
      </div>
    </header>

    <!-- Home -->
    <section id="home" class="panel">
      <div class="panel-head">
        <h2>開戦の儀</h2>
        <p class="muted">難易度を選び、<span id="perRunLabel2">10</span>問勝負。正解の後に解説が出ます。</p>
      </div>

      <div class="grid2">
        <div class="card">
          <div class="card-title">難易度</div>
          <div class="diff-row">
            <button class="diff-btn is-active" type="button" data-diff="normal">普通<br><small>基本〜標準</small></button>
            <button class="diff-btn" type="button" data-diff="easy">やさしい<br><small>入門</small></button>
            <button class="diff-btn" type="button" data-diff="hard">難しい<br><small>応用</small></button>
            <button class="diff-btn" type="button" data-diff="mania">マニア<br><small>沼</small></button>
          </div>

          <label class="check">
            <input id="shuffleChoices" type="checkbox" checked />
            選択肢をシャッフルする
          </label>
        </div>

        <div class="card">
          <div class="card-title">出陣</div>

          <div class="btn-stack">
            <button id="startBtn" class="btn primary" type="button">通常モード開始（<span id="perRunLabel3">10</span>問）</button>
            <button id="reviewBtn" class="btn" type="button" disabled>復習モード開始（間違えた問題）</button>
          </div>

          <div class="home-stats">
            <div class="stat">
              <div class="k">問題数</div>
              <div class="v" id="totalCount">-</div>
            </div>
            <div class="stat">
              <div class="k">読み込み</div>
              <div class="v" id="loadState">未</div>
            </div>
            <div class="stat">
              <div class="k">復習候補</div>
              <div class="v" id="wrongPool">0</div>
            </div>
          </div>

          <p id="homeMsg" class="msg"></p>
          <p class="tiny muted">※ GitHub Pages で動作（questions.json を fetch）。ローカル直開き（file://）は不可。</p>
        </div>
      </div>
    </section>

    <!-- Quiz -->
    <section id="quiz" class="panel hidden" aria-live="polite">
      <div class="quiz-top">
        <div class="badges">
          <span id="modeBadge" class="badge">通常</span>
          <span id="diffBadge" class="badge">普通</span>
        </div>

        <div class="progress">
          <div id="progressText" class="progress-text">1 / 10</div>
          <div class="bar">
            <div id="barFill" class="bar-fill" style="width: 10%"></div>
          </div>
        </div>
      </div>

      <div class="qcard">
        <div class="qhead">
          <div id="qNo" class="qno">Q1</div>
          <div id="questionText" class="qtext">…</div>
        </div>

        <div id="tagRow" class="tag-row"></div>
      </div>

      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback"></div>

      <div class="quiz-actions">
        <button id="quitBtn" class="btn" type="button">中断</button>
        <button id="nextBtn" class="btn primary hidden" type="button">次へ</button>
      </div>
    </section>

    <!-- Result -->
    <section id="result" class="panel hidden">
      <div class="panel-head">
        <h2>戦果</h2>
        <p class="muted">結果と復習候補。</p>
      </div>

      <div class="result-grid">
        <div class="card">
          <div class="card-title">スコア</div>
          <div class="big">
            <span id="scoreNum">0</span> / <span id="scoreDen">10</span>
          </div>
          <div class="muted">正答率：<span id="rateNum">0</span>%</div>
          <div class="muted">今回の不正解：<span id="wrongNum">0</span></div>

          <div class="btn-stack">
            <button id="backHomeBtn" class="btn primary" type="button">ホームへ戻る</button>
            <button id="reviewFromResultBtn" class="btn" type="button" disabled>復習を続ける</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">復習候補（最大12件表示）</div>
          <div id="wrongList" class="wrong-list"></div>
        </div>
      </div>
    </section>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-label="設定">
        <div class="modal-head">
          <h3>設定</h3>
          <button class="icon-btn" type="button" data-close="1">閉じる</button>
        </div>

        <div class="modal-body">
          <label class="check">
            <input id="showExplanation" type="checkbox" checked />
            解説を表示する
          </label>

          <label class="check">
            <input id="showTags" type="checkbox" checked />
            タグを表示する
          </label>

          <button id="clearProgress" class="btn danger" type="button">復習データをクリア</button>
        </div>
      </div>
    </div>

  </main>

  <script src="app.js" defer></script>
</body>
</html>
